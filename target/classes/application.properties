# Server Configuration
server.port=8081
server.servlet.context-path=/

# Application Name
spring.application.name=Credit Score Analyzer

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Data Storage Path
app.data.path=src/main/resources/data/
app.upload.path=uploads/

# Python Script Configuration
app.python.script.path=python/Main.py
app.python.executable=python3

# Logging
logging.level.com.securebank=DEBUG
logging.level.org.springframework.web=INFO